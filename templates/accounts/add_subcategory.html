{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Добавить подкатегорию</h2>

    <form method="POST">
        {% csrf_token %}
        {{ subcategory_form.as_p }}
        <button type="submit" class="btn btn-primary">Добавить подкатегорию</button>
    </form>

    <hr>

    <a href="{% url 'add_product' %}" class="btn btn-secondary">Перейти к добавлению товара</a>
</div>
{% endblock %}
