{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm p-4" style="width: 350px; border-radius: 12px;">
        <h2 class="text-center mb-4 text-secondary">Вход</h2>


        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.username.label_tag }}
                {{ form.username }}
            </div>
            <div class="mb-3">
                {{ form.password.label_tag }}
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-dark w-100">Войти</button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'register' %}" class="text-muted text-decoration-none">Нет аккаунта? Зарегистрироваться</a>
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f8f9fa;
        font-family: 'Arial', sans-serif;
    }

    .card {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #dee2e6;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 6px;
    }

    button {
        font-size: 16px;
        padding: 10px;
        border-radius: 6px;
    }

    .alert {
        font-size: 14px;
    }
</style>
{% endblock %}
