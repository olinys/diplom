{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Добавить товар</h2>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ product_form.as_p }}
        <button type="submit" class="btn btn-primary">Добавить товар</button>
    </form>

    <hr>

    <h4>Не нашли нужную категорию?</h4>
    <a href="{% url 'add_category' %}" class="btn btn-secondary">Добавить категорию</a>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const categorySelect = document.querySelector('[name="category"]');
        const subcategorySelect = document.querySelector('[name="subcategory"]');
        
        if (categorySelect && subcategorySelect) {
            categorySelect.addEventListener('change', function() {
                const categoryId = this.value;
                
                subcategorySelect.innerHTML = '<option value="">Загрузка...</option>';
                
                if (categoryId) {
                    fetch(`/accounts/get_subcategories/${categoryId}/`)
                        .then(response => response.json())
                        .then(data => {
                            subcategorySelect.innerHTML = '<option value="">Выберите подкатегорию</option>';
                            data.subcategories.forEach(subcategory => {
                                const option = document.createElement('option');
                                option.value = subcategory.id;
                                option.textContent = subcategory.name;
                                subcategorySelect.appendChild(option);
                            });
                        })
                        .catch(error => {
                            console.error('Ошибка загрузки подкатегорий:', error);
                            subcategorySelect.innerHTML = '<option value="">Ошибка загрузки</option>';
                        });
                } else {
                    subcategorySelect.innerHTML = '<option value="">Выберите подкатегорию</option>';
                }
            });
        }
    });
</script>
{% endblock %}
