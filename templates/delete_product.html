{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Удаление товара</h2>
    <p>Вы уверены, что хотите удалить "{{ product.name }}"?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
